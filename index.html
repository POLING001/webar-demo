<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>孟良崮民兵支前AR</title>

  <!-- 引入 A-Frame 和 MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .a-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #tip {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 22px;
      z-index: 999;
      text-shadow: 0 0 8px black;
      font-family: Arial, "Microsoft YaHei";
      pointer-events: none; /* 让点击穿透，避免阻止按钮 */
    }
  </style>
</head>
<body>

  <div id="tip">正在启动摄像头...</div>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: no; uiScanning: no; uiError: yes;"
    embedded
    renderer="antialias: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 共用的视频元素，JavaScript 会动态更换 src -->
      <video id="arVideo" loop playsinline webkit-playsinline preload="auto" muted crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ========== 第一个识别目标 ========== -->
    <a-entity id="target0" mindar-image-target="targetIndex:0">
      <a-plane
        class="video-plane"
        width="1"
        height="0.56"
        position="0 0 0.03"
        visible="false"
        material="shader: flat; src: #arVideo; side: double;"></a-plane>
    </a-entity>

    <!-- ========== 第二个识别目标（如果有） ========== -->
    <a-entity id="target1" mindar-image-target="targetIndex:1">
      <a-plane
        class="video-plane"
        width="1"
        height="0.56"
        position="0 0 0.03"
        visible="false"
        material="shader: flat; src: #arVideo; side: double;"></a-plane>
    </a-entity>

    <!-- ========== 第三个识别目标（如果有） ========== -->
    <a-entity id="target2" mindar-image-target="targetIndex:2">
      <a-plane
        class="video-plane"
        width="1"
        height="0.56"
        position="0 0 0.03"
        visible="false"
        material="shader: flat; src: #arVideo; side: double;"></a-plane>
    </a-entity>

    <!-- 可以继续添加更多 target... -->

  </a-scene>

  <script>
    window.onload = function() {
      const scene = document.querySelector('a-scene');
      const video = document.querySelector('#arVideo');
      const tip = document.querySelector('#tip');
      const videoPlanes = document.querySelectorAll('.video-plane'); // 所有视频平面
      let currentVideoSrc = '';
      let currentTarget = null;

      // ---------- AR 准备就绪 ----------
      scene.addEventListener('arReady', () => {
        tip.innerHTML = '摄像头已启动，请扫描识别图';
      });

      // ---------- AR 出错 ----------
      scene.addEventListener('arError', (e) => {
        console.error('AR错误:', e);
        tip.innerHTML = '摄像头启动失败：' + (e.message || '未知错误');
      });

      // ---------- 为所有识别目标绑定事件 ----------
      const targets = document.querySelectorAll('[mindar-image-target]');
      targets.forEach((target) => {
        // 识别成功
        target.addEventListener('targetFound', (event) => {
          console.log('识别成功，目标索引:', event.detail.targetIndex);
          const targetIndex = event.detail.targetIndex;
          const videoNumber = targetIndex + 1;  // 视频文件编号从1开始
          const videoPath = 'assets/video' + videoNumber + '.mp4';

          // 如果视频源改变，则加载新视频
          if (currentVideoSrc !== videoPath) {
            video.pause();
            video.src = videoPath;
            video.load();
            currentVideoSrc = videoPath;
            tip.innerHTML = '正在加载视频...';

            // 视频加载完成后自动播放
            video.addEventListener('loadeddata', function onLoaded() {
              video.currentTime = 0;
              video.muted = true; // 保持静音以通过自动播放策略
              video.play()
                .then(() => {
                  // 隐藏其他所有平面，只显示当前目标的平面
                  videoPlanes.forEach(plane => plane.setAttribute('visible', 'false'));
                  target.querySelector('.video-plane').setAttribute('visible', 'true');
                  tip.innerHTML = '播放中...';
                })
                .catch(err => {
                  console.warn('自动播放失败:', err);
                  tip.innerHTML = '点击屏幕播放';
                });
              video.removeEventListener('loadeddata', onLoaded);
            });

            // 视频加载错误
            video.addEventListener('error', function onError() {
              console.error('视频加载失败:', videoPath);
              tip.innerHTML = '视频加载失败，请检查路径';
              video.removeEventListener('error', onError);
            });

          } else {
            // 同一视频，直接重播
            video.currentTime = 0;
            video.muted = true;
            video.play()
              .then(() => {
                videoPlanes.forEach(plane => plane.setAttribute('visible', 'false'));
                target.querySelector('.video-plane').setAttribute('visible', 'true');
                tip.innerHTML = '播放中...';
              })
              .catch(err => {
                console.warn('播放失败:', err);
                tip.innerHTML = '点击屏幕播放';
              });
          }
        });

        // 识别丢失（不隐藏视频，防止抖动）
        target.addEventListener('targetLost', () => {
          console.log('目标丢失，但保留视频画面');
          // 你也可以选择隐藏视频平面，但为了防止闪烁，这里不操作
        });
      });

      // ---------- 点击页面开启声音（如果视频正在播放） ----------
      document.body.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          console.log('声音已开启');
        }
      });
    };
  </script>
</body>
</html>
