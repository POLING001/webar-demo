<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">


<title>
孟良崮民兵支前AR
</title>


<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js">
</script>


<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
</script>



<style>


body{

margin:0;

overflow:hidden;

font-family:"Microsoft YaHei";

}



/* 顶部提示 */

#tip{


position:absolute;


top:30px;


left:0;


width:100%;


text-align:center;


font-size:22px;


color:white;


z-index:999;


text-shadow:
0 0 5px black;


}



</style>


</head>




<body>



<div id="tip">

正在启动AR，请稍候...

</div>




<a-scene


mindar-image="

imageTargetSrc:assets/targets.mind;

autoStart:true;

uiLoading:yes;

uiScanning:yes;

uiError:yes;

"


embedded


color-space="sRGB"


renderer="

colorManagement:true;

"


vr-mode-ui="

enabled:false

"


device-orientation-permission-ui="

enabled:false

"


>


<!-- 视频资源 -->

<a-assets>


<video

id="arVideo"

src="assets/militia.mp4"

loop

muted

autoplay

playsinline

webkit-playsinline

preload="auto"

>

</video>


</a-assets>





<!-- 摄像机 -->

<a-camera

position="0 0 0"

look-controls="enabled:false"

>

</a-camera>






<!-- 图片识别目标 -->


<a-entity

mindar-image-target="targetIndex:0"

>



<!-- 视频覆盖区域 -->

<a-video


src="#arVideo"


width="2"


height="1.12"


position="0 0 0.05"


rotation="0 0 0"


>


</a-video>



</a-entity>




</a-scene>







<script>


document.addEventListener(
"DOMContentLoaded",

()=>{


let target =
document.querySelector(
"[mindar-image-target]"
);



let video =
document.querySelector(
"#arVideo"
);



let tip =
document.querySelector(
"#tip"
);





// 页面启动

tip.innerHTML=
"请扫描民兵支前图片";





// 识别成功


target.addEventListener(

"targetFound",

()=>{


console.log(
"AR识别成功"
);



alert(
"识别成功，正在播放历史复原视频"
);



tip.innerHTML=
"民兵支前历史场景复原";





video.play()

.then(()=>{


console.log(
"视频播放成功"
);


})

.catch(
(error)=>{


console.log(
"视频播放失败",
error
);


alert(
"视频播放失败，请点击屏幕后重试"
);


}

);



}

);






// 离开识别范围


target.addEventListener(

"targetLost",

()=>{


console.log(
"目标丢失"
);


tip.innerHTML=
"请重新扫描民兵支前图片";


video.pause();


}

);



}

);



</script>



</body>


</html>
