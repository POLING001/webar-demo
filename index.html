<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">


<title>
孟良崮民兵支前AR
</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



<style>


html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:transparent;

}



/* AR全屏 */

a-scene{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

}



/* 提示文字 */

#tip{

position:absolute;

top:20px;

left:0;

width:100%;

text-align:center;

color:white;

font-size:22px;

z-index:999;

text-shadow:
0 0 8px black;

font-family:
Arial,
"Microsoft YaHei";

}


</style>


</head>





<body>



<div id="tip">

正在启动摄像头...

</div>







<a-scene



mindar-image="

imageTargetSrc:assets/targets.mind;

autoStart:true;

filterMinCF:0.0001;

filterBeta:0.001;

uiLoading:no;

uiScanning:no;

uiError:yes;

"



embedded




renderer="

colorManagement:true;

alpha:true;

"



background="

transparent:true;

"



vr-mode-ui="enabled:false"



device-orientation-permission-ui="enabled:false"

>









<a-assets>


<video
id="video1"
src="assets/video1.mp4"
loop
playsinline
webkit-playsinline
preload="auto">
</video>


<video
id="video2"
src="assets/video2.mp4"
loop
playsinline
webkit-playsinline
preload="auto">
</video>


<video
id="video3"
src="assets/video3.mp4"
loop
playsinline
webkit-playsinline
preload="auto">
</video>


</a-assets>









<a-camera

position="0 0 0"

look-controls="enabled:false"

>

</a-camera>









<a-entity

id="target"

mindar-image-target="targetIndex:0"

>







<!-- 测试层 -->

<a-plane

id="testPlane"

color="red"

opacity="0"

width="1"

height="0.56"

position="0 0 0"

>

</a-plane>









<!-- AR视频层 -->

<a-plane


id="videoPlane"


width="1"


height="0.56"


position="0 0 0.02"



visible="false"



material="

shader:flat;

src:#arVideo;

side:double;

"

>


</a-plane>







</a-entity>







</a-scene>









<script>


window.onload=function(){



let target =
document.querySelector("#target");


let video =
document.querySelector("#arVideo");


let videoPlane =
document.querySelector("#videoPlane");


let tip =
document.querySelector("#tip");



let unlocked=false;



tip.innerHTML=
"请扫描民兵支前图片";









/*
================================
首次点击解锁声音
================================
*/


document.body.addEventListener(

"click",

function(){


if(unlocked)
return;



video.muted=false;



video.play()

.then(()=>{


video.pause();

video.currentTime=0;


unlocked=true;


console.log(
"声音解锁成功"
);



tip.innerHTML=
"请扫描图片";



})

.catch(err=>{


console.log(
"声音解锁失败",
err
);


});


}

);









/*
================================
识别成功
================================
*/


target.addEventListener(

"targetFound",

function(){



console.log(
"识别成功"
);



tip.innerHTML=
"识别成功，正在播放";




// 从头开始

video.currentTime=0;




video.play()

.then(()=>{



console.log(
"视频播放成功"
);




// 显示视频

videoPlane.setAttribute(

"visible",

"true"

);





// 刷新纹理

setTimeout(()=>{


if(

videoPlane.components.material

&&

videoPlane.components.material.material.map

){


videoPlane.components.material.material.map.needsUpdate=true;


}


},100);



})

.catch(err=>{


console.log(
"播放失败",
err
);



tip.innerHTML=
"点击屏幕播放";


});



}

);









/*
================================
目标丢失
================================
*/


target.addEventListener(

"targetLost",

function(){


console.log(
"目标丢失"
);



tip.innerHTML=
"请重新扫描";


// 不停止视频
// 避免轻微丢失重新加载



videoPlane.setAttribute(

"visible",

"false"

);



}

);





}



</script>






</body>


</html>
