<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
孟良崮民兵支前AR
</title>


<script src="
https://aframe.io/releases/1.5.0/aframe.min.js">
</script>


<script src="
https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
</script>


<style>

body{
margin:0;
overflow:hidden;
}


#tip{

position:absolute;

top:30px;

width:100%;

text-align:center;

font-size:20px;

color:white;

z-index:10;

}

</style>


</head>



<body>


<div id="tip">

请扫描民兵支前图片

</div>




<a-scene


mindar-image="

imageTargetSrc:assets/target.mind;

"


embedded


color-space="sRGB"


renderer="
colorManagement:true
"


vr-mode-ui="
enabled:false
"



>


<a-assets>


<video

id="arVideo"

src="assets/militia.mp4"

loop

muted

playsinline

webkit-playsinline>


</video>



</a-assets>




<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>




<a-entity

mindar-image-target="
targetIndex:0
">


<a-video


src="#arVideo"


width="1"


height="0.56"


position="
0 0 0.01
"

>


</a-video>



</a-entity>



</a-scene>





<script>


let target=document.querySelector(
"[mindar-image-target]"
);


let video=document.querySelector(
"#arVideo"
);



target.addEventListener(
"targetFound",
()=>{


console.log(
"识别成功"
);


video.play();


document.querySelector("#tip")
.innerHTML=
"民兵支前历史复原";



}

);



target.addEventListener(
"targetLost",
()=>{


video.pause();


}

);



</script>



</body>

</html>
