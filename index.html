<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">


<title>
孟良崮民兵支前AR
</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



<style>


html,body{

margin:0;

padding:0;

width:100%;

height:100%;

overflow:hidden;

}



/* 全屏AR */

a-scene{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

}




#tip{

position:absolute;

top:20px;

left:0;

width:100%;

text-align:center;

color:white;

font-size:22px;

z-index:999;

text-shadow:0 0 8px black;

}


</style>


</head>




<body>


<div id="tip">

正在启动摄像头...

</div>




<a-scene


mindar-image="

imageTargetSrc:assets/targets.mind;

autoStart:true;

filterMinCF:0.0001;

filterBeta:0.001;

uiLoading:no;

uiScanning:no;

uiError:yes;

"


embedded


renderer="

colorManagement:true;

"


vr-mode-ui="enabled:false"



device-orientation-permission-ui="enabled:false"



>





<a-assets>


<video

id="arVideo"

src="assets/militia.mp4"

loop

muted

playsinline

webkit-playsinline

preload="auto"

></video>


</a-assets>





<a-camera

position="0 0 0"

look-controls="enabled:false"

></a-camera>





<a-entity

id="target"

mindar-image-target="targetIndex:0"

>


<!-- 测试红框 -->

<a-plane

id="testPlane"

color="red"

opacity="0"

width="1"

height="0.56"

position="0 0 0"

>


</a-plane>





<a-video


id="videoPlane"

src="#arVideo"

width="1"

height="0.56"

position="0 0 0.01"


visible="false"


></a-video>



</a-entity>





</a-scene>





<script>


window.onload=function(){



let target=document.querySelector("#target");


let video=document.querySelector("#arVideo");


let videoPlane=document.querySelector("#videoPlane");


let testPlane=document.querySelector("#testPlane");


let tip=document.querySelector("#tip");



console.log(target);



tip.innerHTML="请扫描民兵支前图片";





target.addEventListener(

"targetFound",

function(){



console.log(
"================="
);

console.log(
"识别成功"
);



tip.innerHTML=
"识别成功，正在播放";



alert("识别成功");


// 显示测试

testPlane.setAttribute(
"opacity",
"0.5"
);



// 显示视频

videoPlane.setAttribute(
"visible",
"true"
);



video.play();



}

);






target.addEventListener(

"targetLost",

function(){


console.log(
"目标丢失"
);


tip.innerHTML=
"请重新扫描";



video.pause();


}

);



}



</script>



</body>


</html>
